spring.application.name=backend
server.port=8080

logging.level.root=info
logging.level.com.backend=info

spring.profiles.include=secret

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# S3
app.aws.region=${AWS_REGION:ap-northeast-2}
app.aws.s3.bucket=${AWS_S3_BUCKET:}
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}


#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.secret=local-dev-only-change-this-secret-key-32b
app.jwt.expiration-ms=3600000


spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

#app.video.max-file-size-bytes=${VIDEO_MAX_FILE_SIZE_BYTES:209715200}
app.video.max-file-size-bytes=${VIDEO_MAX_FILE_SIZE_BYTES:509715200}
app.video.allowed-extensions=${VIDEO_ALLOWED_EXTENSIONS:mov,mp4}
app.video.allowed-content-types=${VIDEO_ALLOWED_CONTENT_TYPES:video/quicktime,video/mp4}


app.ffprobe.path=${FFPROBE_PATH:ffprobe}

app.env=${APP_ENV:local}
app.fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
app.fastapi.connect-timeout-ms=3000
app.fastapi.read-timeout-ms=5000
# INTERNAL_TOKEN / SPRING_INTERNAL_TOKEN are already bound below. Do not declare
# a second pair of app.*-token keys. Empty defaults fail FastAPI auth (401) and
# Spring /internal/** callbacks (no ROLE_INTERNAL). Set the env vars or
# application-secret.properties instead of duplicating these lines.
app.fastapi.internal-token=${INTERNAL_TOKEN:}
app.spring.internal-token=${SPRING_INTERNAL_TOKEN:}

app.analysis.scheduler.enabled=${ANALYSIS_SCHEDULER_ENABLED:false}
app.analysis.scheduler.dispatch-interval-ms=1000
app.analysis.scheduler.recovery-interval-ms=10000
app.analysis.scheduler.timeout-interval-ms=30000
app.analysis.scheduler.batch-size=20
app.analysis.scheduler.lease-seconds=60
app.analysis.processing-timeout-minutes=30


